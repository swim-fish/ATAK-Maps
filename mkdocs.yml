site_name: ATAK 臺灣地圖來源
site_description: 適用於 ATAK 的臺灣地圖來源，可使用 QR Code 或一鍵連結快速匯入。
site_url: https://swim-fish.github.io/ATAK-Maps/
repo_url: https://github.com/swim-fish/ATAK-Maps
docs_dir: docs

theme:
  name: material
  language: zh-TW
  logo: images/atak-maps-logo.png
  favicon: images/atak-maps-logo.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: 切換至深色模式
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: 切換至淺色模式
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - 首頁: index.md
  - 地圖: maps.md
  - 安裝指南: install-guide.md
  - 臺灣涵蓋範圍: taiwan-map-coverage.md
  - 建立地圖來源: creating-custom-maps.md
  - XML 參考: xml-reference.md
  - 發布新版本: release-guide.md
  - 翻譯對照表: translation-glossary.md

exclude_docs: |
  superpowers/

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/maps.css

extra_javascript:
  - javascripts/maps-filter.js

plugins:
  - search
