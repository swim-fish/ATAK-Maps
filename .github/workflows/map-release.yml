# Triggers for every push to `master` (or when run manually). semantic-release
# decides whether the Conventional Commits since the last tag warrant a release.
#
# Flow:
#   1. Sanity-check: latest git tag must be on this branch
#   2. Builds complete and Taiwan ATAK Mission Package v2 ZIPs + checksums
#   3. semantic-release
#        • calculates the next SemVer
#        • tags the commit
#        • creates / updates the GitHub Release
#        • uploads the ZIP as an asset
#
# NOTE: The companion .releaserc.json must include @semantic-release/github
#       with the matching asset block.

name: Map Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: map-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master          # Always use latest master tip, not the triggering SHA.
          fetch-depth: 0       # @semantic-release/git may have pushed a chore(release)
          fetch-tags: true     # commit since the push that triggered this run.

      # Defense-in-depth: abort if the latest tag isn't reachable from HEAD.
      # This catches history rewrites that orphan tags (e.g. filter-branch).
      - name: Verify tag ancestry
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No version tags found — first release, proceeding."
            exit 0
          fi
          echo "Latest tag: $LATEST_TAG"
          if ! git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "::error::Tag $LATEST_TAG is NOT an ancestor of HEAD. Tags may have been orphaned by a history rewrite. Fix tags before releasing."
            exit 1
          fi
          echo "Tag $LATEST_TAG is reachable from HEAD — safe to release."

      - name: Build map ZIPs
        run: python3 scripts/build_release_packages.py

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: atak-map-release-files
          path: |
            dist/atak-maps.zip
            dist/atak-maps-taiwan.zip
            dist/atak-maps-taiwan-essential.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: ^25.0.0
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
